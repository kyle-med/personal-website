<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <style>
      .staff { fill: none; stroke: #000; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .snake { fill: none; stroke: #000; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .crossbar { fill: #000; }
      @media (prefers-color-scheme: dark) {
        .staff { stroke: #fff; }
        .snake { stroke: #fff; }
        .crossbar { fill: #fff; }
      }
    </style>
  </defs>

  <!-- H left vertical + staff -->
  <line class="staff" x1="34" y1="12" x2="34" y2="118"/>

  <!-- H right vertical -->
  <line class="staff" x1="94" y1="12" x2="94" y2="118"/>

  <!-- H crossbar -->
  <rect class="crossbar" x="34" y="56" width="60" height="16" rx="2"/>

  <!-- Snake body winding around left staff -->
  <!-- Bottom loop (left side of staff) -->
  <path class="snake" d="M34 108 Q20 108 20 98 Q20 88 34 88"/>
  <!-- Cross right, loop around right side -->
  <path class="snake" d="M34 88 Q48 88 48 78 Q48 68 34 68"/>
  <!-- Loop left side -->
  <path class="snake" d="M34 68 Q20 68 20 58 Q20 48 34 48"/>
  <!-- Loop right side, then up to head -->
  <path class="snake" d="M34 48 Q48 48 48 38 Q48 28 34 28"/>

  <!-- Snake head -->
  <ellipse class="snake" cx="34" cy="24" rx="6" ry="5" fill="#000" style="fill:#000"/>
  <style>
    @media (prefers-color-scheme: dark) {
      ellipse.snake { fill: #fff; }
    }
  </style>

  <!-- Snake tongue -->
  <line class="snake" x1="34" y1="19" x2="40" y2="16"/>
  <line class="snake" x1="34" y1="19" x2="42" y2="19"/>

  <!-- Snake eye -->
  <circle cx="32" cy="24" r="1.2" fill="#fff"/>
</svg>
